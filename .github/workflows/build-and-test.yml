name: build project

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'master'

jobs:
  build_and_test:
    permissions:
      contents: read
      checks: write
    name: 'Build & Test'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup dotnet core
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore -s https://api.nuget.org/v3/index.json
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --verbosity normal --logger "trx;LogFileName=test-results.trx" /p:CollectCoverage=true  /p:CoverletOutput=./TestResults/ /p:CoverletOutputFormat=cobertura MiHomeUnitTests
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: success()
      with:
        name: xUnit Tests
        path: MiHomeUnitTests/TestResults/test-results.trx
        reporter: dotnet-trx
    - name: Get test report results with precise percentage
      run: |
        python3 <<'PY'
        import os
        import xml.etree.ElementTree as ET

        results = ET.parse("MiHomeUnitTests/TestResults/test-results.trx")
        namespace = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
        counters = results.find("t:ResultSummary/t:Counters", namespace)
        if counters is None:
            raise ValueError("The TRX report has no ResultSummary/Counters element.")

        coverage = ET.parse("MiHomeUnitTests/TestResults/coverage.cobertura.xml").getroot()
        values = {
            "PASSED": int(counters.attrib["passed"]),
            "FAILED": int(counters.attrib["failed"]),
            "TOTAL": int(counters.attrib["total"]),
            "COVERAGE_PERCENTAGE": f"{float(coverage.attrib['line-rate']) * 100:.2f}",
        }
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
            for name, value in values.items():
                environment.write(f"{name}={value}\n")
        PY
    - name: Print test results
      run: echo "${{ env.PASSED }}/${{ env.TOTAL }} tests passed"
    - name: Create the tests badge
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: d70d7e06eb53484b7514bfd63cec6885
        filename: test_results.json
        label: tests
        message: ${{ env.PASSED }} passed ${{ env.FAILED }} failed
        color: green
    - name: Create code cov badge
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: d70d7e06eb53484b7514bfd63cec6885
        filename: code_cov.json
        label: coverage
        message: ${{ env.COVERAGE_PERCENTAGE }}%
        color: red
        namedLogo: umbrel
        logoColor: red

