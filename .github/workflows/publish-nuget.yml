name: publish nuget

on:
  workflow_dispatch:
    inputs:
      publish_package:
        description: 'Publish to nuget.org after verification (disable for verification only)'
        type: boolean
        default: true

jobs:
  package:
    permissions:
      contents: read
    name: 'Test and pack'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
    - uses: actions/checkout@v5
    - name: Setup dotnet core
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - name: Read package version
      id: version
      run: echo "value=$(dotnet msbuild MiHomeLib -getProperty:Version -nologo)" >> "$GITHUB_OUTPUT"
    - name: Restore dependencies
      run: dotnet restore -s https://api.nuget.org/v3/index.json
    - name: Test
      run: dotnet test --no-restore MiHomeUnitTests
    - name: Pack
      run: dotnet pack MiHomeLib --no-restore -c Release -o artifacts
    - uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: |
          artifacts/MiHomeLib.${{ steps.version.outputs.value }}.nupkg
          artifacts/MiHomeLib.${{ steps.version.outputs.value }}.snupkg
        if-no-files-found: error

  package_consumers:
    needs: package
    permissions:
      contents: read
    strategy:
      matrix:
        include:
        - os: windows-latest
          framework: net462
        - os: ubuntu-latest
          framework: net8.0
        - os: ubuntu-latest
          framework: net10.0
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x
    - uses: actions/download-artifact@v4
      with:
        name: release-package
        path: artifacts/package
    - name: Restore consumer from release package
      run: dotnet restore PackageSmokeTests/PackageSmokeTests.csproj -p:MiHomePackageVersion=${{ needs.package.outputs.version }} --configfile PackageSmokeTests/NuGet.Config
    - name: Run packaged library consumer
      run: dotnet run --project PackageSmokeTests/PackageSmokeTests.csproj -c Release -f ${{ matrix.framework }} -p:MiHomePackageVersion=${{ needs.package.outputs.version }} --no-restore

  publish:
    if: inputs.publish_package
    needs: [package, package_consumers]
    permissions:
      contents: read
      id-token: write
    name: 'Publish to nuget.org'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@v4
      with:
        name: release-package
        path: artifacts
    - name: NuGet login (OIDC -> temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push MiHomeLib ${{ needs.package.outputs.version }}
      run: dotnet nuget push artifacts/MiHomeLib.${{ needs.package.outputs.version }}.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
